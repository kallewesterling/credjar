title: Credjar
description: Inspect, issue and revoke Credly badges from the command line.
url: https://westerling.nu
baseurl: /credjar

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache

search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  Credjar on GitHub: https://github.com/kallewesterling/credjar
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/kallewesterling/credjar
gh_edit_branch: dev
gh_edit_source: docs
gh_edit_view_mode: edit

footer_content: >-
  Credjar is an independent open-source tool and is not affiliated with
  Credly. Released under the MIT licence.

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue

# Internal working notes; not part of the published site.
exclude:
  - plans/
